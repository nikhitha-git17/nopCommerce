apiVersion: apps/v1
kind: Deployment
metadata:
  name: nop-commerce-deployment
  labels:
    app: nop-commerce
    name: devnamespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nop-commerce
  template:
    metadata:
      labels:
        app: nop-commerce
    spec:
      containers:
        - name: nop-commerce
          image: 
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"